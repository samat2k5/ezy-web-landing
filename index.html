          "@type": "Question",

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, ezyHR is a 100% cloud-based HRMS and payroll platform accessible from any modern web browser or mobile device."
          }
        },
        {
          "@type": "Question",
          "name": "Is ezyHR suitable for Singapore SMEs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ezyHR is engineered specifically for Singapore SMEs, growing businesses, and multi-branch companies."
          }
        },
        {
          "@type": "Question",
          "name": "Does ezyHR support Singapore statutory payroll requirements?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ezyHR supports automated CPF contribution calculations (for Singapore Citizens and PRs across age tiers), Skills Development Levy (SDL), Self-Help Group (SHG) contributions, and statutory capping rules."
          }
        },
        {
          "@type": "Question",
          "name": "Does ezyHR support IRAS Auto-Inclusion Scheme (AIS) and IR8A export?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. ezyHR enables HR administrators to generate audit-ready IRAS AIS files and export IR8A / IR8S forms."
          }
        },
        {
          "@type": "Question",
          "name": "Can ezyHR export bank GIRO files for Singapore banks?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, ezyHR generates bank GIRO files compatible with major Singapore financial institutions including DBS, OCBC, UOB, HSBC, and Standard Chartered."
          }
        }
      ]
    }
